# 推送 main 自动：类型检查 → D1 审计 → 构建 → 冒烟 → 迁移 → 部署
# GitHub Secrets：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID / R2_BUCKET_NAME
# （与 minidriver 仓库配同值即联动：共享账号与素材库）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查 + D1 审计 + 构建
        run: |
          npm run typecheck
          node scripts/audit-d1.mjs
          npm run build
      - name: 冒烟测试（本地 workerd）
        run: |
          printf 'DEPLOY_MODE=standalone\nSESSION_ENC_KEY=%s\nSETUP_TOKEN=ci-smoke-token\nAPP_PUBLIC_URL=http://127.0.0.1:8787\n' \
            "$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" > .dev.vars
          npm run db:migrate:local
          npx wrangler dev --port 8787 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health >/dev/null && break; sleep 1; done
          SMOKE_SETUP_TOKEN=ci-smoke-token npm run smoke
      - name: 注入部署配置
        run: node scripts/resolve-config.mjs
      - name: 远程 D1 迁移（幂等）
        run: npx wrangler d1 migrations apply miniblog --remote
      - name: 部署
        run: npx wrangler deploy
